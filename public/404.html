<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ClimaSchool AI</title>

         so send visitors to the app shell, which then resolves the route. -->

      window.location.replace("/climaschool-ai/" + window.location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/climaschool-ai/" />
  </head>

    <p>Redirecting to <a href="/climaschool-ai/">ClimaSchool AI</a>…</p>
  </body>
</html>
