# ClimaSchool AI — IP + port vhost, for use before the domain is pointed.
#
#   http://169.58.42.182:8084/
#
# IMPORTANT — this server already runs ~10 other production apps behind nginx on
# ports 80, 443 and 8080-8083 (alvatechlab.com and others). This file therefore:
#   * listens on 8084 and nothing else,
#   * declares NO `default_server`,
#   * uses an explicit `server_name`, never the catch-all `_`.
# Those three rules are what stop this vhost from capturing another site's traffic.
#
# Install:
#   sudo cp nginx-climaschool.conf /etc/nginx/sites-available/climaschool
#   sudo ln -sfn /etc/nginx/sites-available/climaschool /etc/nginx/sites-enabled/climaschool
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 8084/tcp     # only if ufw is active

server {
    listen 8084;
    listen [::]:8084;

    server_name 169.58.42.182;

    root /var/www/climaschool/web;
    index index.html;

    access_log /var/log/nginx/climaschool.access.log;
    error_log  /var/log/nginx/climaschool.error.log;

    # Field users are on mobile data — compression is the cheapest latency win here.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    client_max_body_size 4m;

    # ── API ──────────────────────────────────────────────────────────────────
    # uvicorn is on loopback only; nginx is the sole public entry point.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Swagger UI, its schema, and the health probe used by deploy.sh and uptime checks.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8100/openapi.json;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8100/docs;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── media ────────────────────────────────────────────────────────────────
    # Large assets (the explainer film) live outside the SPA web root on purpose:
    # deploy.sh mirrors dist/ into /web and deletes anything not in the build, so
    # a video parked there would vanish on the next deploy.
    location /media/ {
        alias /var/www/climaschool/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;   # lets browsers seek within the video
        try_files $uri =404;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # Vite fingerprints everything under /assets/, so those files are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html is the version pointer; caching it strands users on an old build.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Small hardening headers; CSP is intentionally omitted until the console's
    # inline requirements are known.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
